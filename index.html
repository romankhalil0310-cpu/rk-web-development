
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK Web Development</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>RK Web Development</h2>
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="home">
    <h1>We Build Modern Websites</h1>
    <p>Professional websites for growing businesses.</p>
    <a href="#contact" class="btn">Get Started</a>
  </section>

  <section id="services">
    <h2>Our Services</h2>
    <p>Business Websites | Web Applications | Responsive Design</p>
  </section>
  
<section id="contact">
  <h2>Let's Work Together</h2>
  <p>Have a project in mind? Contact us today.</p>

  <form id="contactForm">
    <input
      type="text"
      id="name"
      placeholder="Your Name"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Your Email"
      required
    >

    <textarea
      id="message"
      placeholder="Tell us about your project"
      required
    ></textarea>

    <button type="submit" class="btn">
      Send Message
    </button>
  </form>
</section>

  <script src="script.js"></script>
</body>
</html>
